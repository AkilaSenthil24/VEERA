{% extends "base.html" %}
{% block title %}Login — FindBack-Campus{% endblock %}

{% block content %}
<section class="auth-wrapper">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="form-card form-card-narrow">
      <div style="margin-bottom: 24px;">
        <h1 class="page-title" style="font-size: 1.75rem;">Sign In to FindBack-Campus</h1>
        <p class="page-subtitle">Access your student dashboard to manage reported items and review ownership claims.</p>
      </div>

      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="next" value="{{ next_url }}" />

        <div style="display: flex; flex-direction: column; gap: 18px;">
          <div class="form-group">
            <label for="email" class="form-label">College Email</label>
            <input type="email" id="email" name="email" class="form-control" required autocomplete="email" value="{{ email_prefill }}" placeholder="name@campus.edu" />
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <div class="password-field">
              <input type="password" id="login-password" name="password" class="form-control" required autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="password-toggle" data-toggle-password="login-password" aria-label="Show password" aria-pressed="false">
                <svg data-eye-open width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg data-eye-closed style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 6px;">Login to Dashboard</button>
        </div>
      </form>

      <div class="divider-line"></div>
      <p style="margin: 0; font-size: 0.92rem; color: var(--text-secondary); text-align: center;">
        New to FindBack-Campus? <a href="{{ url_for('register') }}" style="color: var(--blue-primary); font-weight: 600;">Create a student account</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
