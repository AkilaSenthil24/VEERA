{% extends "base.html" %}
{% block title %}Page Not Found — FindBack-Campus{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="empty-state" style="max-width: 560px; margin: 0 auto;">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      </div>
      <h1 style="font-size: 1.6rem; margin-bottom: 8px;">Page or Item Not Found</h1>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">
        The item listing or page you requested could not be located. It may have been removed or the URL may be incorrect.
      </p>
      <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home</a>
        <a href="{{ url_for('browse') }}" class="btn btn-secondary">Browse Items</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
