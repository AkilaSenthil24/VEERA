{% extends "base.html" %}
{% block title %}Register — FindBack-Campus{% endblock %}

{% block content %}
<section class="auth-wrapper">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="form-card form-card-medium" style="max-width: 680px;">
      <div style="margin-bottom: 24px;">
        <h1 class="page-title" style="font-size: 1.75rem;">Create Your Campus Account</h1>
        <p class="page-subtitle">Register with your college email to report missing belongings, log found items, and verify claims.</p>
      </div>

      <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-grid">
          <div class="form-group">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" required minlength="2" value="{{ form_data.get('full_name', '') }}" placeholder="e.g. Jordan Alvarez" />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">College Email</label>
            <input type="email" id="email" name="email" class="form-control" required value="{{ form_data.get('email', '') }}" placeholder="name@campus.edu" />
          </div>

          <div class="form-group">
            <label for="student_id" class="form-label">Student ID</label>
            <input type="text" id="student_id" name="student_id" class="form-control" required minlength="3" value="{{ form_data.get('student_id', '') }}" placeholder="e.g. STU-2026-4091" />
          </div>

          <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-control" required value="{{ form_data.get('phone', '') }}" placeholder="(555) 123-4567" />
          </div>

          <div class="form-group">
            <label for="department" class="form-label">Department</label>
            <select id="department" name="department" class="form-control" required>
              <option value="">Select department</option>
              {% for dept in departments %}
                <option value="{{ dept }}" {% if form_data.get('department') == dept %}selected{% endif %}>{{ dept }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="year" class="form-label">Year of Study</label>
            <select id="year" name="year" class="form-control" required>
              <option value="">Select year</option>
              {% for yr in study_years %}
                <option value="{{ yr }}" {% if form_data.get('year') == yr %}selected{% endif %}>{{ yr }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" />
              <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                <svg data-eye-open width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg data-eye-closed style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div class="password-field">
              <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Re-enter password" />
              <button type="button" class="password-toggle" data-toggle-password="confirm_password" aria-label="Show password" aria-pressed="false">
                <svg data-eye-open width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg data-eye-closed style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
              </button>
            </div>
            <span id="password-match-hint" class="form-hint"></span>
          </div>
        </div>

        <div style="margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
          <span style="font-size: 0.9rem; color: var(--text-secondary);">
            Already registered? <a href="{{ url_for('login') }}" style="color: var(--blue-primary); font-weight: 600;">Sign in here</a>
          </span>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
